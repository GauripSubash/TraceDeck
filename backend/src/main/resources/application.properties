spring.application.name=TraceDeck

# Support running from either the repository root or the backend directory.
# Our .env currently uses simple KEY=value lines, compatible with properties.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/tracedeck
spring.datasource.username=tracedeck
spring.datasource.password=${POSTGRES_PASSWORD}

# Run our explicit SQL schema before Hibernate checks the Java-to-table mapping.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Reject fractional numbers for integer fields instead of silently truncating.
spring.jackson.deserialization.accept-float-as-int=false

# Keep this learning application accessible only on the local computer.
server.address=127.0.0.1
server.port=8080
