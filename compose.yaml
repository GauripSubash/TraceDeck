services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tracedeck
      POSTGRES_USER: tracedeck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracedeck -d tracedeck"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
